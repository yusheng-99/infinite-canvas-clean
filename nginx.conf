server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /api/prompt-manager {
        proxy_pass https://prompt.vioaki.xyz/api/gallery;
        proxy_ssl_server_name on;
        proxy_set_header Host prompt.vioaki.xyz;
    }

    location = /api/catbox-upload {
        client_max_body_size 200m;
        proxy_pass https://catbox.moe/user/api.php;
        proxy_ssl_server_name on;
        proxy_set_header Host catbox.moe;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
